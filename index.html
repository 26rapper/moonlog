  $('#foot').innerHTML = `<b>${esc(TEXT.notice)}</b>` + lines.map(x => `<span>${esc(x)}</span>`).join('');
}
function renderLower() { renderVerdict(); renderConstel(); renderNights(); renderFlow(); renderDuel(); renderVerdictBook(); }

/* Verdict(지시 2-2) — 첫 화면 바로 아래, 아래 섹션 맨 위. 판정 밤 도착(열기 전)엔 빈 영수증이다: LED 꺼진 판 · 이름 · 한 줄 ·
   맨 아래 줄은 비우고, 기준 셋은 글만 두고 끝 칸 · ② 숫자 · 정리 건수 · % 는 '—', 막대는 그리지 않는다(흐림만 걸면 막대
   길이로 결과가 샌다). 판정 뒤엔 판정 밤 값 그대로다(at_verdict 는 밤 배치가 얼린다). ② 숫자는 판정 MDD(b) —
   공개 worst_drop_pct 와 다른 수라 섞지 않고, 없으면 숫자 없이 둔다(기획 ⓐ) */
const V_COLOR = {pass: LED_COLOR.up, fail: LED_COLOR.down, hold: LED_COLOR.flat};
const V_NO = ['①', '②', '③'], V_JOSA = ['을', '를', '을'];
function failList(g) {               // 못 넘은 것만 ①·② 로 잇고 조사는 끝 번호를 따른다
  const k = ['c', 'b', 'd'].map((x, i) => g[x] === 'fail' ? i : -1).filter(i => i >= 0);
  return k.length ? k.map(i => V_NO[i]).join('·') + V_JOSA[k[k.length - 1]] : '';
}
/* 기준 셋 아래 줄 — 다시 판정이면 보류 뒤 30밤, 90번째 밤에 300건을 못 채운 판이면 '못 채운 채', 아니면 넘어 · 채워 */
function footOf(sv, a, n) {
  if (sv.again) return TEXT.vFootAgain(n, md(sv.first.to));
  return sv.nights === SEASON_MAX && a.closed != null && a.closed < SEASON_TRADES ? TEXT.vFootShort(n, sv.nights) : TEXT.vFoot(n, sv.nights);
}
/* 그 판정 밤(날짜)의 판정 정정 줄 — 여럿이면 마지막(얼린 숫자 꼬리표 · 보류 → 미달 바랜 별이 같이 읽는다) */
const verdictFix = day => fixesOf(D).filter(f => f.kind === 'verdict' && f.date === day).slice(-1)[0] || null;
let V_ANIM = false;                   // 판정 밤 연 뒤 한 번만(지시 3-2)
function renderVerdict() {
  const el = $('#verdict');
  if (!svVerdict()) { el.hidden = true; el.innerHTML = ''; return; }
  const k = SV.kind, a = SV.at, g = SV.gates, veil = !svOpen(), c = V_COLOR[k];
  const mark = s => veil || !TEXT.vMark[s] ? '<span class="gm hold">—</span>'
    : `<span class="gm${s === 'fail' ? ' no' : s === 'hold' ? ' hold' : ''}">${esc(TEXT.vMark[s])}</span>`;
  const mdd = veil ? ' <b>—</b>' : a.judge_mdd_pct != null ? ` <b>${esc(pctOf(a.judge_mdd_pct))}</b>` : '';
  const m = a.moonlog_pct, b = a.btc_pct, top = Math.max(0, ...[m, b].filter(p => p != null).map(Math.abs));
  const bar = p => veil || p == null || !top ? '' : `<i class="${p >= 0 ? 'up' : 'down'}" style="${p >= 0 ? 'left' : 'right'}:50%;width:${(48 * Math.abs(p) / top).toFixed(1)}%"></i>`;
  const cls = p => p == null || veil ? 'flat' : p > FLAT ? 'up' : p < -FLAT ? 'down' : 'flat';
  const pv = p => veil || p == null ? '—' : pct(p, 2);
  const lead = b == null ? TEXT.btcNone : m == null ? '' : Math.abs(m - b) < 0.05 ? TEXT.sinceNear : TEXT.sinceLead(m > b ? TEXT.kong : TEXT.btcName);
  const say = k === 'fail' ? TEXT.vSay.fail(failList(g)) : k === 'hold' ? TEXT.vSay.hold(md(SV.next)) : TEXT.vSay.pass();
  const st = D.summary && D.summary.started, ruleDay = st ? `${st.slice(0, 4)}년 ${md(st)}` : '';
  const n = veil || a.closed == null ? '—' : a.closed.toLocaleString('en-US'), first = SV.first;
  const foot = footOf(SV, a, n), vfix = !veil && verdictFix(a.to);
  el.innerHTML = `<div class="row"><h2>${esc(TEXT.vTitle)}</h2></div>` +
    `<p class="range" id="verdictRange">${esc(rangeText(a))}</p>` +
    `<div class="vtop"><div class="numrow" id="vNum" role="img" aria-label="${esc(veil ? '' : TEXT.vName[k])}">` +
    `<div class="glow${veil ? '' : ' on'}" id="vGlow" style="background:${c}"></div>` +
    `<span id="vLed">${veil ? ledHTML('8888', null, {sign: false}) : ledHTML(TEXT.vLed[k], c, {sign: false})}</span></div>` +
    `<span class="vname">${veil ? '' : esc(TEXT.vName[k])}</span></div>` +
    `<div class="vbody${veil ? ' veiled' : ''}"${veil ? ' aria-hidden="true"' : ''}>` +
    (veil ? '' : `<p class="vsay" id="verdictSay">${esc(say)}</p>`) +
    // 판정 정정 뒤 — 숫자는 다시 얼리지 않는다(규약). 정정 줄은 판정 한 줄 바로 아래(판정 이름 예외 자리), 꼬리표는 점선 아래
    // 기준 셋 첫 줄(디자인 대조 10-24 — 한 줄 아래면 '(정정 전)' 이 새 판정 문장에 붙어 읽힌다)
    (vfix ? `<p class="vfix" id="verdictFix" data-words-allow="verdict"><b>${esc(TEXT.fixWord)}</b> · ${esc(fixText(vfix))} · ${esc(fixWhy(vfix))}</p>` : '') +
    `<div class="gates">${vfix ? `<span class="vft" id="verdictFrozen">${esc(TEXT.vFrozen(md(a.to)))}</span>` : ''}` +
    `<span class="gh">${esc(TEXT.vGateHead(ruleDay))}</span>` +
    `<span class="gi">${V_NO[0]}</span><span class="gt">${esc(TEXT.vGate[0])}</span>${mark(g.c)}` +
    `<span class="gi">${V_NO[1]}</span><span class="gt">${esc(TEXT.vGate[1])}${mdd} · ${esc(TEXT.vGate2Tail)}</span>${mark(g.b)}` +
    `<span class="gi">${V_NO[2]}</span><span class="gt">${esc(TEXT.vGate[2])}</span>${mark(g.d)}` +
    `<span class="gf">${esc(foot)}</span></div>` +
    `<div class="vrec"><span class="vh">${esc(TEXT.vRecHead)}</span>` +
    `<div class="duel-grid"><span>${esc(TEXT.kong)}</span><b class="${cls(m)}">${esc(pv(m))}</b><div class="track">${bar(m)}</div>` +
    `<span>${esc(TEXT.btcName)}</span><b class="${cls(b)}">${esc(pv(b))}</b><div class="track">${bar(b)}</div></div>` +
    (veil ? '' : `<p class="sub">${esc(lead)}</p>`) + '</div>' +
    (veil ? '' : `<p class="vlaw">${esc(TEXT.vLaw[k])}</p>`) + '</div>' +
    (first ? `<p class="vfirst" id="verdictFirst">${esc(TEXT.vFirst(md(first.to), first.moonlog_pct == null ? '—' : pct(first.moonlog_pct, 2)))}</p>` : '');
  el.hidden = false;
  // LED — 판정 밤 연 뒤 이 칸이 처음 화면에 들어올 때 한 번: 꺼진 판 → 0.5초 8 → 0.8초 낱말 + 두 번 꿈뻑(첫 화면 LED 와 같은 결).
  // 움직임 줄이기 · 캡처(#open)는 끝 모습 그대로
  if (STATE !== 'open' || SV.after || V_ANIM || FROZEN || reduced() || !('IntersectionObserver' in window)) return;
  V_ANIM = true;
  const box = $('#vLed'), glow = $('#vGlow'), word = TEXT.vLed[k], live = () => $('#vLed') === box;
  box.innerHTML = ledHTML('8888', null, {sign: false});
  glow.classList.remove('on');
  const io = new IntersectionObserver(es => {
    if (!es[0].isIntersecting) return;
    io.disconnect();
    setTimeout(() => { if (live()) box.innerHTML = ledHTML('8888', LED_EIGHT, {sign: false}); }, 500);
    setTimeout(() => { if (live()) { box.innerHTML = ledHTML(word, c, {sign: false, cls: 'blink'}); glow.classList.add('on'); } }, 800);
  }, {threshold: 0.6});
  io.observe($('#vNum'));
}
/* Logbook How it works 맨 위 한 단락(지시 2-4) — 판정이 보일 때만(판정 밤 도착엔 결과를 말하지 않는다) */
function renderVerdictBook() {
  const box = $('#folds details[data-fold="how"] > div');
  if (!box) return;
  const old = $('#verdictBook');
  if (old) old.remove();
  if (!svOpen()) return;
  const p = document.createElement('p');
  p.className = 'vbook';
  p.id = 'verdictBook';
  p.dataset.wordsAllow = 'verdict';
  p.textContent = TEXT.vBookHead(SV.day, SV.nights, TEXT.vName[SV.kind], SV.again) + ' ' +
    (SV.kind === 'hold' ? TEXT.vBook.hold(md(SV.next)) : TEXT.vBook[SV.kind]());
  box.prepend(p);
}

/* ── 지난 기록 보기 — 지난 칸을 누르면 첫 화면(얼굴 · 창 날씨 · 바탕 색조 · LED · 금액 · 장부 · 맞힘 줄)이 그날 값으로
   (디자인 지시 영문제목 · 초승달 · 지난기록 C절). 열기 움직임 없이 바로, LED 는 켜진 채. 새 공개 값은 없다 — 이미 공개된
   scene · equity_daily · trades_daily 의 그날 줄과 그날을 고친 정정만 읽는다. 기다릴 때 · 도착 · 연 뒤 어디서든 열고,
   '오늘 기록으로' 면 그 상태로 돌아간다(도착이면 다시 '열기'). 아래 칸들(별 · 지난 밤들 · 흐름 선 · 맞대결)은 그 상태 그대로 ── */
const PAST_TEXT = {of: d => `${md(d)} ${dow(d)}요일 기록`, back: '오늘 기록으로'};
let PAST = null;                      // 보고 있는 지난날의 scene 줄(없으면 오늘)
const pastBar = row => `<div class="pastbar" id="pastBar"><span>${esc(PAST_TEXT.of(row.date) + (isPrep(row) ? ` · ${TEXT.prepWord}` : isUnc(row) ? ` · ${TEXT.uncWord}` : ''))}</span>` +
  `<button type="button" id="pastBack">${esc(isUnc(row) || svStop() ? TEXT.uncBack : PAST_TEXT.back)}</button></div>`;
/* 그날 줄 — 장면 줄(준비 기간 줄 포함)에 있는 지난날만. 오늘 · 앞날 · 없는 날 · 틀린 꼴(장면 줄에 없다)은 null(= 오늘로).
   준비 기간 장면 날과 시즌 장면 날은 겹치지 않는다(시즌 1일째 = 준비 기간 끝 다음 날) */
function pastRow(d) {
  if (!LAST) return null;
  if (d >= LAST.date) return uncRows().find(r => r.date === d) || null;        // 셈에 안 든 밤(마지막 기록 뒤 · 지시 3-3)
  return [...(D.scene.prep || []), ...D.scene.rows].find(r => r.date === d) || null;
}
/* 그날 맞힘 — 이 기기가 그날을 판정해 둔 것(judge 가 남긴다). 없으면 맞힘 줄을 안 그린다 */
function pastJudge(date) {
  const v = verdicts()[date];
  return Array.isArray(v) && ['hit', 'miss', 'draw', 'rest'].includes(v[0]) ? {result: {kind: v[0]}, streak: +v[1] || 0} : null;
}
function showPast(row) {
  PAST = row;
  ANIM++;                             // 돌던 열기 움직임이 있으면 멈춘다
  $('#first').dataset.past = row.date;
  $('#topRight').textContent = isPrep(row) ? TEXT.prepWord : SV && SV.at && SV.kind === 'fail' ? topLine() : TEXT.nextAt;   // 준비 기간 날은 '준비 기간' · 미달 판은 머리 줄 그대로(연 뒤 '최종점검 끝' · 도착은 낱말 없이 — 대조 ② · 감사)
  $('#veil').hidden = true;
  $('#window').dataset.weather = row.weather;
  tint(row.weather);
  setFace(faceOf(row.weather), 1);
  photoLook(0, lightOf(row.weather), 1);                 // 그날 밤 연 뒤 끝 밝기 그대로(3판-b)
  $('#fog').style.opacity = 0;
  skyMode(row.weather); skyOpacity(1); skyUpto(Infinity);
  $('#state').innerHTML = openBody(pastJudge(row.date), row);
  renderNights();
}
function toToday() {
  if (!PAST) return;
  PAST = null;
  delete $('#first').dataset.past;
  if (STATE === 'open') reveal(null, true);
  else if (STATE === 'wait') renderWait();
  else { $('#window').dataset.weather = 'none'; renderArrived(); }      // 도착 — 날씨를 비우고 다시 '열기'
  renderNights();
}
/* 사람이 누름 — 지난 칸은 그날로, 오늘 칸은 오늘로. 주소를 #d= 로 바꿔(공유용) 첫 화면으로 올라간다 */
function pickDay(d) {
  const row = pastRow(d);
  if (row) showPast(row); else toToday();
  try { history.replaceState(null, '', row ? `#d=${row.date}` : location.pathname + location.search); } catch (e) {}
  window.scrollTo({top: 0, behavior: reduced() ? 'auto' : 'smooth'});
  const back = $('#pastBack');
  if (back) back.focus({preventScroll: true});
}

function render(data) {
  D = data;
  const rows = (D.scene && D.scene.rows) || [], prepRows = (D.scene && D.scene.prep) || [], sp = D.summary && D.summary.prep;
  PREP = sp && sp.from && sp.to ? {from: sp.from, to: sp.to, nights: sp.nights, last: sp.last !== false,
                                     day1: D.summary.season_start || addDays(sp.to, 1)} : null;
  PREP_MODE = !!PREP && !rows.length && prepRows.length > 0;
  LAST = rows.length ? rows[rows.length - 1] : PREP_MODE ? prepRows[prepRows.length - 1] : null;
  SV = seasonVerdict();
  renderFolds(); renderFoot(D.site);
  // 그날 날씨는 연 뒤(기다릴 때는 이미 연 날)에만 싣는다 — 도착의 DOM 에 결과가 새지 않게(감사 · 기획 2026-10-19)
  $('#window').dataset.weather = 'none';
  if (!LAST) {                        // 시즌 전
    setState('wait');
    tint('clear');
    setFace('deadpan', 0);
    photoLook(0, 0.82, 1);
    skyMode('clear');
    $('#state').innerHTML = `<p class="voice">${esc(TEXT.prestart)}</p>`;
    renderLower();
    return;
  }
  const opened = store.get(KEYS.opened);
  if (!NOW0) timer = setInterval(tick, 1000);         // Next Log 칸의 시계(있을 때만 다시 그린다)
  if (HASH.has('at')) { renderArrived(); reveal(Number(HASH.get('at')) || 0); return; }
  if (HASH.has('open')) { renderArrived(); reveal(1e9); }
  else {
    if (opened && opened >= LAST.date) renderWait(); else renderArrived();
    renderLower();
    if (HASH.has('click') && !$('#veil').hidden) $('#openBtn').click();   // 캡처 — 사람이 누른 것과 같다
  }
  // 주소 #d=YYYY-MM-DD — 그날 기록을 바로 연다(공유 · 쇼츠 프로필 링크). 오늘 · 없는 날 · 틀린 꼴이면 오늘 그대로
  const p = pastRow(HASH.get('d'));
  if (p) showPast(p);
  // 캡처 · 시험만 — #tap=날짜: 그 칸을 누른다 · #back: 이어서 '오늘 기록으로' 를 누른다(사람이 누른 것과 같다)
  const tap = [...document.querySelectorAll('#nights .night')].find(b => b.dataset.day === HASH.get('tap'));
  if (tap) tap.click();
  if (HASH.has('back') && $('#pastBack')) $('#pastBack').click();
}

/* 첫 화면 — 창 사진은 처음에 투명(hide-img)이고, 그 상태의 얼굴 src 가 정해져 받아진 뒤 0.25초에 나타난다.
   HTML 기본 src(무표정)가 기다릴 때 · 연 뒤 화면에서 먼저 번쩍 비치지 않게(오너 2026-10-20) */
function showImgs() {
  const w = $('#window');
  if (!w.classList.contains('hide-img')) return;
  Promise.all(['#photo', '#face'].map(s => $(s).decode ? $(s).decode().catch(() => {}) : null))
    .then(() => w.classList.remove('hide-img'));
}
async function load() {
  try {
    const got = await Promise.all(FILES.map(f => fetch(`public/${f}.json`, {cache: 'no-cache'}).then(r => {
      if (!r.ok) throw new Error(f);
      return r.json();
    })));
    const data = {};
    FILES.forEach((f, i) => { data[f] = got[i]; });
    // 그날 얼굴 사진을 먼저 받아 둔다 — 열기를 누르는 순간 바로 뜨게
    const rows0 = (data.scene && data.scene.rows) || [];
    if (rows0.length) new Image().src = FACE_SRC(faceOf(rows0[rows0.length - 1].weather));
    render(data);
  } catch (e) {
    $('#state').innerHTML = `<p class="voice">${esc(TEXT.failed)}</p>`;
    renderFoot(null);
  }
  showImgs();
}

if (HERO_FRAME === 'center') $('#window').classList.add('center');
$('#openBtn').addEventListener('click', () => reveal());
document.addEventListener('click', ev => {
  const b = ev.target.closest('.pick');
  if (!b) return;
  const box = b.closest('.picks');
  setGuess(box.dataset.target, b.dataset.pick);
  box.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (STATE === 'arrived') veilGuess();
});
document.addEventListener('click', ev => {             // 지난 칸 · '오늘 기록으로' · '준비 기간 보기' · '판정 보기'
  if (ev.target.closest('#verdictGo')) {
    $('#verdict').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth'});
    return;
  }
  if (ev.target.closest('#prepGo')) {
    const n = $('#nights');
    $('#nightsSec').scrollIntoView({behavior: reduced() ? 'auto' : 'smooth'});
    if (n) n.scrollTo({left: 0, behavior: reduced() ? 'auto' : 'smooth'});
    return;
  }
  const c = ev.target.closest('#nights .night');
  if (c) { pickDay(c.dataset.day); return; }
  if (ev.target.closest('#pastBack')) pickDay(null);
});
window.addEventListener('hashchange', () => {        // 주소 꼬리를 손으로 바꿨을 때 — 그날로, 아니면 오늘로
  const row = pastRow(new URLSearchParams(location.hash.slice(1)).get('d'));
  if (row) showPast(row); else toToday();
});
$('#nights').addEventListener('scroll', nightsEdge, {passive: true});
$('#nightsPrev').addEventListener('click', () => nightsPage(-1));
$('#nightsNext').addEventListener('click', () => nightsPage(1));
window.addEventListener('resize', nightsEdge);
$('#constel').addEventListener('click', showStar);
$('#constel').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && (e.target.getAttribute('data-star') || e.target.getAttribute('data-unc'))) { e.preventDefault(); showStar(e); } });
document.addEventListener('visibilitychange', () => {
  document.body.classList.toggle('paused', document.hidden);
  if (!document.hidden && !RAF && !reduced()) RAF = requestAnimationFrame(loop);
});
window.addEventListener('resize', () => SKIES.forEach(s => s.resize()));
if (INSTAGRAM_URL) { $('#insta').href = INSTAGRAM_URL; $('#insta').hidden = false; }
/* 만든 곳 표식(디자인 판정 지시 4절) — 바닥 맨 끝, 출처 줄 아래. 'GROO STUDIO' 한 줄(모노 · 위아래 가는 줄) + 작은 한글 한 줄,
   묶음 통째로 링크 하나. STUDIO_URL 이 비면 만들지 않는다(DOM 에 한 글자도 없다) */
if (STUDIO_URL) {
  const a = document.createElement('a');
  a.className = 'studio';
  a.id = 'studio';
  a.href = STUDIO_URL;
  a.rel = 'noopener';
  a.setAttribute('aria-label', TEXT.studio);
  a.innerHTML = '<span class="sm" aria-hidden="true"><b>GROO</b> <i>STUDIO</i></span>' + `<span class="sk">${esc(TEXT.studioKo)}</span>`;
  $('#foot').after(a);
}
if (GOATCOUNTER) {                  // 값이 있을 때만 태그 한 줄
  const gc = document.createElement('script');
  gc.async = true;
  gc.src = 'https://gc.zgo.at/count.js';
  gc.setAttribute('data-goatcounter', GOATCOUNTER);
  document.body.appendChild(gc);
}
document.getElementById('siteName').innerHTML = `<span class="wm-en">${esc(SITE_NAME_EN)}</span><span class="wm-ko">${esc(SITE_NAME)}</span>`;
load();
</script>
</body>
